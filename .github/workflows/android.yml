name: Build PadKey Bridge APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/padkey.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/padkey.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ "$SIGNED" = "1" ]; then gradle --no-daemon assembleRelease; cp app/build/outputs/apk/release/app-release.apk ../padkey-bridge.apk
          else gradle --no-daemon assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk ../padkey-bridge.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: padkey-bridge-apk
          path: padkey-bridge.apk
